appId: com.example.app_aplicador
---
# GEOPRAG-125: apos login, o usuario deve cair em /ponto (hoje a tela
# "Meus Pontos de Aplicacao", GEOPRAG-111) sem um botao de voltar na AppBar
# (a pilha de navegacao deve ser resetada via go(), nao empilhada com
# pushReplacement). Ver AplicadorGoRouterNavigator.toPonto().
- runFlow: ../auth/login_success.yaml
- assertVisible: "Meus Pontos de Aplicação"
- assertNotVisible: "Voltar"
- assertNotVisible: "Back"
- takeScreenshot: geoprag-125-sem-voltar-apos-login
